<section class="card" aria-label="$title">
  <h2 :text="$title"></h2>
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" aria-hidden="true">
    <use href="$icon"></use>
  </svg>
  <label for="$control_id">Outbound channel</label>
  <select :ref="channel" id="$control_id" :value="$selected" :input="$inputs.channel"
          :loop="$options" :key="id" :limit="3">
    <option value="$item.value" :text="$item.label"></option>
  </select>
  <dl><div><dt>Selected channel</dt><dd :ref="selection" :text="$selected"></dd></div></dl>
  <table>
    <caption>Field mapping</caption>
    <thead><tr><th>Incoming field</th><th>Draft</th></tr></thead>
    <tbody :ref="rows" :loop="$rows" :key="id" :limit="3">
      <tr><td :text="$item.label"></td><td><input aria-label="$item.label"></td></tr>
    </tbody>
  </table>
  <svg viewBox="0 0 40 24" width="40" height="24" aria-label="Mapping markers">
    <g :loop="$markers" :key="id" :limit="3"><circle cx="$item.x" cy="12" r="3" /></g>
  </svg>
</section>
